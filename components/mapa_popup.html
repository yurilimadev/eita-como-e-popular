<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: transparent;
}
.improvement-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f6eedc;
    border: 2px solid #1e1b18;
    border-radius: 12px;
    padding: 12px;
    margin: 4px;
    box-shadow: 3px 3px 0px #1e1b18;
    color: #1e1b18;
    font-size: 13px;
}
.improvement-header h3 {
    margin: 0 0 6px 0;
    font-size: 1.1em;
    font-weight: 800;
    text-align: center;
}
.repo-link {
    display: inline-block;
    background-color: #f4c430;
    padding: 6px 14px;
    border-radius: 50px;
    color: #1e1b18;
    text-decoration: none;
    font-weight: 700;
    text-align: center;
    margin: 6px 0;
    border: 1.5px solid #1e1b18;
}
.responsive-image {
    width: 150px;
    border-radius: 8px;
    margin: 6px 0;
}
.improvement-footer {
    text-align: center;
    margin-top: 4px;
    font-size: 0.8em;
    font-weight: 600;
}
</style>
</head>
<body>
<div class="improvement-card">
    <div class="improvement-header">
        <h3>📍 Achou no mapa!</h3>
    </div>
    <img src="data:image/png;base64,{encoded_string}"
          alt="Mapa"
          class="responsive-image">
    <a href="{repo_url}" class="repo-link" target="_blank">
        🔗 Ver repositório
    </a>
    <div class="improvement-footer">
        <small>Contribua com o projeto</small>
    </div>
</div>
</body>
</html>
