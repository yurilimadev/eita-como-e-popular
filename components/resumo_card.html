<div style="
    background-color: #f6eedc;
    border: 2px solid #1e1b18;
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 14px;
    box-shadow: 4px 4px 0px #1e1b18;
    color: #1e1b18;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <div>
            <span style="font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #5c5346;">
                Cidades superadas no Brasil
            </span>
            <div style="font-size: 1.8rem; font-weight: 900; color: #1e1b18; line-height: 1.15;">
                🏙️ {total_cidades} <span style="font-size: 1rem; font-weight: 600; color: #5c5346;">de 5.571 ({percentual}%)</span>
            </div>
        </div>
        <div style="
            background-color: #f4c430;
            border: 1.5px solid #1e1b18;
            border-radius: 10px;
            padding: 8px 14px;
            text-align: right;
        ">
            <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #1e1b18;">
                Maior cidade que você lotaria
            </div>
            <div style="font-size: 1.05rem; font-weight: 800; color: #1e1b18;">
                📍 {maior_cidade} - {maior_estado} ({maior_populacao} hab.)
            </div>
        </div>
    </div>
</div>
